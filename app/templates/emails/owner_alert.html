{% extends "emails/_layout.html" %}

{% block body %}
<p style="margin:0 0 6px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#a8634f;">Studio alert</p>
<h1 style="margin:0 0 8px;font-family:Georgia,serif;font-weight:normal;font-size:26px;">{{ headline }}</h1>
<p style="margin:0;color:#7a706a;line-height:1.6;">{{ message }}</p>
{% endblock %}

{% block footer %}
<a href="{{ dashboard_url }}" style="display:inline-block;background:#a8634f;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-size:14px;">Open dashboard</a>
{% endblock %}
